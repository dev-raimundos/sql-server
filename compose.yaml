services:
  sqlserver:
    build:
      context: .
      dockerfile: Dockerfile
    image: sqlserver-homelab:2022-CU25-healthcheck
    container_name: sqlserver
    restart: unless-stopped
    ports:
      - "${HOST_IP}:1433:1433"
    env_file:
      - .env
    environment:
      TZ: America/Belem
      ACCEPT_EULA: ${ACCEPT_EULA}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: ${MSSQL_PID}
      MSSQL_AGENT_ENABLED: "true"
      MSSQL_MEMORY_LIMIT_MB: "2048"
      HEALTHCHECK_USER: ${HEALTHCHECK_USER:-healthcheck_user}
      HEALTHCHECK_PASSWORD: ${HEALTHCHECK_PASSWORD}
    volumes:
      - /home/docker-data/sqlserver:/var/opt/mssql
    networks:
      - home-network
    healthcheck:
      test:
        [
          "CMD",
          "/opt/mssql-tools18/bin/sqlcmd",
          "-S",
          "localhost",
          "-U",
          "${HEALTHCHECK_USER:-healthcheck_user}",
          "-P",
          "${HEALTHCHECK_PASSWORD}",
          "-C",
          "-Q",
          "SELECT 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "3.0"
          memory: 2560M
        reservations:
          memory: 512M

networks:
  home-network:
    external: true
