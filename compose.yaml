services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU25-ubuntu-22.04
    container_name: sqlserver
    restart: unless-stopped
    ports:
      - "1433:1433"
    env_file:
      - .env
    environment:
      ACCEPT_EULA: ${ACCEPT_EULA}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: ${MSSQL_PID}
    volumes:
      - /home/docker-data/sqlserver:/var/opt/mssql
    networks:
      - home-network
    deploy:
      resources:
        limits:
          memory: 6g
        reservations:
          memory: 512m

volumes:
  sqlserver_data:

networks:
  home-network:
    external: true
