name: sqlserver

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU16-ubuntu-22.04
    container_name: sqlserver
    hostname: sqlserver
    restart: unless-stopped

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
      MSSQL_PID: Developer
      MSSQL_AGENT_ENABLED: "false"
      MSSQL_MEMORY_LIMIT_MB: "4096"
      TZ: ${TZ:-America/Sao_Paulo}

    ports:
      - "${SQL_PORT:-1433}:1433"

    volumes:
      - sqlserver-data:/var/opt/mssql

    networks:
      - coolify

    deploy:
      resources:
        limits:
          memory: 6g
        reservations:
          memory: 1g

    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -C -N d -l 10 > /dev/null 2>&1"]
      interval: 30s
      timeout: 15s
      retries: 6
      start_period: 90s

    security_opt:
      - no-new-privileges:true

    ulimits:
      nofile:
        soft: 65536
        hard: 65536

volumes:
  sqlserver-data:
    driver: local

networks:
  coolify:
    external: true
